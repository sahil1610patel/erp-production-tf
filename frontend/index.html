    }}
    return <div className="app">{mobile&&<div className="mobile-scrim" onClick={()=>setMobile(false)}/>}<aside className={'sidebar '+(mobile?'open':'')} aria-label="Primary navigation"><div className="brand"><span className="brand-mark"><Icon name="grid" size={20}/></span>nexus<span style={{fontSize:8,letterSpacing:1.4,color:'#8793ab',alignSelf:'end',paddingBottom:4}}>ERP</span></div><div className="nav-label">WORKSPACE</div>{NAV.slice(0,7).map(([id,icon,label])=><button key={id} className={'nav-btn '+(view===id?'active':'')} onClick={()=>setView(id)} aria-current={view===id?'page':undefined}><Icon name={icon} size={17}/>{label}{id==='inventory'&&items.length>0&&<span className="nav-count">{items.length}</span>}</button>)}<div className="nav-label" style={{marginTop:17}}>GOVERNANCE</div>{NAV.slice(7).map(([id,icon,label])=><button key={id} className={'nav-btn '+(view===id?'active':'')} onClick={()=>setView(id)} aria-current={view===id?'page':undefined}><Icon name={icon} size={17}/>{label}</button>)}<div className="sidebar-bottom"><div className="workspace-tag"><div style={{display:'flex',alignItems:'center',gap:7,color:'#e0d9f9',marginBottom:4}}><Icon name="shield" size={14}/>Enterprise workspace</div><div style={{color:'#7887a0'}}>Tenant {tenant} · {currency} reporting</div></div><button className="nav-btn" onClick={logout}><Icon name="logout" size={16}/>Sign out</button></div></aside><div className="main"><header className="topbar"><button className="btn small menu-toggle" aria-label="Toggle navigation" onClick={()=>setMobile(!mobile)}><Icon name="menu" size={18}/></button><div className="top-search"><Icon name="search" size={17}/><input aria-label="Search current module" placeholder={`Search ${TITLES[view][0].toLowerCase()}…`} value={query} onChange={e=>{setQuery(e.target.value);if(view==='overview')setView('inventory')}}/></div><div className="top-right"><div className="health-indicator" style={{color:health?.dbConnected?'#31816b':'#ac9055'}}><span className="dot"/>{health?.dbConnected?'Connected':'Checking data'}</div><select className="tenant-select" aria-label="Active enterprise tenant" value={tenant} onChange={e=>setTenant(e.target.value)}>{!tenants.length&&<option value={tenant}>{user.companyName||`Tenant ${tenant}`}</option>}{tenants.map(t=><option key={t.TenantID} value={t.TenantID}>{t.CompanyName}</option>)}</select><div style={{width:1,height:27,background:'#edf0f5'}}/><div className="avatar">{initials(user.fullName)}</div><div className="user-label"><div style={{fontSize:11,fontWeight:650}}>{user.fullName}</div><div className="cell-sub" style={{fontSize:9}}>{user.role==='ADMIN'?'Enterprise administrator':user.role==='OPERATOR'?'Operations manager':'Compliance auditor'}</div></div></div></header><main className="content" id="main-content"><div className="page-heading"><div><div className="eyebrow">{tenants.find(t=>String(t.TenantID)===String(tenant))?.CompanyName||user.companyName||'ENTERPRISE WORKSPACE'} / {view==='overview'?'HOME':TITLES[view][0]}</div><h1>{TITLES[view][0]}</h1><p className="subtitle">{TITLES[view][1]}</p></div><div className="actions"><button className="btn" aria-label="Refresh workspace data" disabled={busy} onClick={refresh}><Icon name="refresh" size={14} className={busy?'spin':''}/>{busy?'Refreshing':'Refresh'}</button>{actionByView[view]}</div></div><Notice error={error} onClose={()=>setError(null)}/>{busy&&!lastRefresh?<div className="panel"><div className="empty loading"><Icon name="refresh" className="spin" size={24} style={{margin:'0 auto 12px'}}/><strong>Loading your workspace</strong>Retrieving your tenant’s operational records…</div></div>:content()}<footer className="footer"><span>NEXUS ENTERPRISE · Operations with clarity.</span><span>{currency} · {new Date().toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})} · Role: {user.role}</span></footer></main></div>{modalView()}{toast&&<div className="toast" role="status"><span style={{display:'flex',alignItems:'center',gap:10}}><Icon name="check" size={16}/>{toast}</span></div>}</div>;
  }
  function Stat({icon,label,value,foot,warning}){return <div className="stat"><div className="stat-top"><span>{label}</span><span className="stat-icon" style={warning?{background:'#fff5df',color:'#c19a50'}:{}}><Icon name={icon} size={16}/></span></div><div className="stat-value">{value}</div><div className={'stat-foot '+(warning?'':'positive')}><span className="dot" style={{color:warning?'#d5ac56':undefined}}/>{foot}</div></div>}
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
  <script id="erp-runtime-loader">
    // Development single-file runtime. The release builder emits a CSP-compatible app.js instead.
    try {
      if (!window.React || !window.ReactDOM || !window.Babel) throw new Error('Frontend vendor assets are missing. Run the documented frontend build before serving this page.');
      new Function(Babel.transform(document.getElementById('erp-source').textContent, {presets: ['react'], filename: 'erp-app.jsx'}).code)();
    } catch (error) {
      const message = document.createElement('div'); message.style.cssText = 'padding:40px;max-width:700px;margin:auto;color:#a14f5c;font:14px system-ui';
      message.textContent = 'Nexus could not start: ' + error.message; document.getElementById('root').replaceChildren(message);
    }
  </script>
</body>
