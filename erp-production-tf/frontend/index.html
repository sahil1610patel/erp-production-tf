<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Global ERP v3.0 | Enterprise Resource Planning Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Safe JSON parser that explains exact CloudFront / Origin errors if HTML is returned
    async function safeParseResponse(res, endpoint) {
      const rawText = await res.text();
      const trimmed = (rawText || '').trim();
      if (trimmed.startsWith('<')) {
        if (res.status === 502 || res.status === 504) {
          throw new Error(`CloudFront ${res.status} Bad Gateway on ${endpoint}: In CloudFront -> Origins, edit your ALB Origin and set Protocol to "HTTP only" (Port 80), NOT HTTPS.`);
        }
        if (res.status === 403 || res.status === 405) {
          throw new Error(`CloudFront ${res.status} on ${endpoint}: In CloudFront -> Behaviors -> /api/*, set Allowed HTTP Methods to "GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE".`);
        }
        if (trimmed.includes('Nexus Global ERP')) {
          throw new Error(`CloudFront routed ${endpoint} to S3 instead of ALB: In CloudFront -> Behaviors, ensure path pattern "/api/*" points to your ALB Origin.`);
        }
        throw new Error(`Received HTML instead of JSON from ${endpoint} (HTTP ${res.status}). Check CloudFront /api/* Behavior & ALB Origin Protocol (must be HTTP only).`);
      }
      try {
        return JSON.parse(trimmed);
      } catch (e) {
        throw new Error(`Invalid JSON from ${endpoint} (HTTP ${res.status}): ${trimmed.slice(0, 120)}`);
      }
    }

    function EnterpriseErpApp() {
      const [token, setToken] = useState(() => localStorage.getItem('erp_jwt'));
      const [user, setUser] = useState(() => {
        try {
          const saved = localStorage.getItem('erp_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });

      // Login State
      const [loginEmail, setLoginEmail] = useState('admin@nexuscorp.com');
      const [loginPass, setLoginPass] = useState('Admin@2026!');
      const [authError, setAuthError] = useState(null);
      const [authLoading, setAuthLoading] = useState(false);

      // Workspace Navigation & Multi-Tenant State
      const [activeModule, setActiveModule] = useState('WMS');
      const [tenants, setTenants] = useState([]);
      const [activeTenantId, setActiveTenantId] = useState(1);

      // Core ERP Data State
      const [items, setItems] = useState([]);
      const [warehouses, setWarehouses] = useState([]);
      const [movements, setMovements] = useState([]);
      const [financeLedger, setFinanceLedger] = useState([]);
      const [salesOrders, setSalesOrders] = useState([]);
      const [employees, setEmployees] = useState([]);
      const [banner, setBanner] = useState(null);

      // WMS Table Filtering & Pagination
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedWarehouseId, setSelectedWarehouseId] = useState('ALL');
      const [stockFilter, setStockFilter] = useState('ALL');
      const [currentPage, setCurrentPage] = useState(1);
      const pageSize = 5;

      // Modals State
      const [showItemModal, setShowItemModal] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [showMovementModal, setShowMovementModal] = useState(false);
      const [showSalesModal, setShowSalesModal] = useState(false);
      const [showEmployeeModal, setShowEmployeeModal] = useState(false);

      const [itemForm, setItemForm] = useState({
        sku: '', itemName: '', category: 'Data Center Hardware', description: '',
        unitOfMeasure: 'EA', unitCost: '', unitPrice: '', reorderPoint: '15', reorderQty: '40',
        initialWarehouseId: '', initialBin: 'YYZ-A01-R01', initialQty: '25'
      });

      const [moveForm, setMoveForm] = useState({
        itemId: '', warehouseId: '', binLocation: 'YYZ-A01-R01',
        movementType: 'RECEIPT', quantity: '10', referenceDoc: '', notes: ''
      });

      const [salesForm, setSalesForm] = useState({
        customerName: '', orderTotal: '', warehouseCode: 'YYZ-DC01', status: 'ALLOCATED'
      });

      const [empForm, setEmpForm] = useState({
        fullName: '', jobTitle: '', department: 'Cloud Engineering', location: 'Toronto, ON', annualSalary: '125000'
      });

      const apiFetch = async (url, options = {}) => {
        const headers = {
          'Content-Type': 'application/json',
          ...(options.headers || {})
        };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        if (activeTenantId) headers['X-Tenant-Id'] = String(activeTenantId);

        const res = await fetch(url, { ...options, headers });
        const data = await safeParseResponse(res, url);
        if (res.status === 401) {
          handleLogout();
          throw new Error(data.error || 'Session expired. Please sign in again.');
        }
        if (!res.ok) throw new Error(data.error || 'Operation failed');
        return data;
      };

      const loadAllErpData = async () => {
        if (!token) return;
        try {
          const [tenantList, invData, modData] = await Promise.all([
            apiFetch('/api/tenants'),
            apiFetch('/api/inventory/items'),
            apiFetch('/api/erp/modules')
          ]);
          setTenants(tenantList || []);
          setItems(invData.items || []);
          setWarehouses(invData.warehouses || []);
          setMovements(invData.movements || []);
          setFinanceLedger(modData.financeLedger || []);
          setSalesOrders(modData.salesOrders || []);
          setEmployees(modData.employees || []);
        } catch (err) {
          setBanner({ text: err.message, type: 'error' });
        }
      };

      useEffect(() => {
        if (token) loadAllErpData();
      }, [token, activeTenantId]);

      const handleLogin = async (e) => {
        e.preventDefault();
        setAuthError(null);
        setAuthLoading(true);
        try {
          let res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: loginEmail, password: loginPass })
          });

          // Automatic GET fallback if CloudFront behavior blocked POST method
          if (res.status === 403 || res.status === 405) {
            const q = new URLSearchParams({ email: loginEmail, password: loginPass }).toString();
            res = await fetch(`/api/auth/login?${q}`, { method: 'GET' });
          }

          const data = await safeParseResponse(res, '/api/auth/login');
          if (!res.ok) throw new Error(data.error || 'Login failed');

          localStorage.setItem('erp_jwt', data.token);
          localStorage.setItem('erp_user', JSON.stringify(data.user));
          setToken(data.token);
          setUser(data.user);
          setActiveTenantId(data.user.tenantId);
        } catch (err) {
          setAuthError(err.message);
        } finally {
          setAuthLoading(false);
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('erp_jwt');
        localStorage.removeItem('erp_user');
        setToken(null);
        setUser(null);
      };

      const fillDemoRole = (roleType) => {
        setAuthError(null);
        if (roleType === 'ADMIN') {
          setLoginEmail('admin@nexuscorp.com');
          setLoginPass('Admin@2026!');
        } else if (roleType === 'OPERATOR') {
          setLoginEmail('operator@nexuscorp.com');
          setLoginPass('User@2026!');
        } else {
          setLoginEmail('auditor@nexuscorp.com');
          setLoginPass('Audit@2026!');
        }
      };

      const getEffectiveQty = (item) => {
        if (selectedWarehouseId === 'ALL') return item.TotalQuantityOnHand;
        const match = (item.warehouseBalances || []).find(b => String(b.WarehouseID) === selectedWarehouseId);
        return match ? match.QuantityOnHand : 0;
      };

      const filteredItems = useMemo(() => {
        return items.filter(item => {
          const q = searchQuery.toLowerCase();
          const matchesSearch = !q ||
            item.SKU.toLowerCase().includes(q) ||
            item.ItemName.toLowerCase().includes(q) ||
            item.Category.toLowerCase().includes(q);

          const qty = getEffectiveQty(item);
          const matchesWarehouse = selectedWarehouseId === 'ALL' ||
            (item.warehouseBalances || []).some(b => String(b.WarehouseID) === selectedWarehouseId);

          let matchesStatus = true;
          if (stockFilter === 'OUT') matchesStatus = qty === 0;
          if (stockFilter === 'LOW') matchesStatus = qty > 0 && qty <= item.ReorderPoint;
          if (stockFilter === 'HEALTHY') matchesStatus = qty > item.ReorderPoint;

          return matchesSearch && matchesWarehouse && matchesStatus;
        });
      }, [items, searchQuery, selectedWarehouseId, stockFilter]);

      const totalPages = Math.max(1, Math.ceil(filteredItems.length / pageSize));
      const paginatedItems = useMemo(() => {
        const start = (currentPage - 1) * pageSize;
        return filteredItems.slice(start, start + pageSize);
      }, [filteredItems, currentPage]);

      const kpis = useMemo(() => {
        let totalValuation = 0;
        let lowStockCount = 0;
        let outOfStockCount = 0;
        let totalUnits = 0;

        items.forEach(item => {
          const qty = getEffectiveQty(item);
          totalUnits += qty;
          totalValuation += qty * Number(item.UnitCost || 0);
          if (qty === 0) outOfStockCount++;
          else if (qty <= item.ReorderPoint) lowStockCount++;
        });

        return { totalValuation, lowStockCount, outOfStockCount, totalUnits };
      }, [items, selectedWarehouseId]);

      const openCreateItemModal = () => {
        setEditingItem(null);
        setItemForm({
          sku: '', itemName: '', category: 'Data Center Hardware', description: '',
          unitOfMeasure: 'EA', unitCost: '', unitPrice: '', reorderPoint: '15', reorderQty: '40',
          initialWarehouseId: warehouses[0]?.WarehouseID ? String(warehouses[0].WarehouseID) : '',
          initialBin: 'YYZ-A01-R01', initialQty: '20'
        });
        setShowItemModal(true);
      };

      const openEditItemModal = (item) => {
        setEditingItem(item);
        setItemForm({
          sku: item.SKU, itemName: item.ItemName, category: item.Category,
          description: item.Description || '', unitOfMeasure: item.UnitOfMeasure,
          unitCost: String(item.UnitCost), unitPrice: String(item.UnitPrice),
          reorderPoint: String(item.ReorderPoint), reorderQty: String(item.ReorderQty),
          initialWarehouseId: '', initialBin: '', initialQty: '0'
        });
        setShowItemModal(true);
      };

      const openMovementModal = (item) => {
        const target = item || items[0] || null;
        const defaultWh = target?.warehouseBalances?.[0]?.WarehouseID || warehouses[0]?.WarehouseID || '';
        const defaultBin = target?.warehouseBalances?.[0]?.BinLocation || 'YYZ-A01-R01';
        setMoveForm({
          itemId: target ? String(target.ItemID) : '',
          warehouseId: String(defaultWh),
          binLocation: defaultBin,
          movementType: 'RECEIPT',
          quantity: '10',
          referenceDoc: `PO-2026-${Math.floor(1000 + Math.random() * 9000)}`,
          notes: ''
        });
        setShowMovementModal(true);
      };

      const handleSaveCatalogItem = async (e) => {
        e.preventDefault();
        try {
          if (editingItem) {
            await apiFetch(`/api/inventory/items/${editingItem.ItemID}`, {
              method: 'PUT',
              body: JSON.stringify(itemForm)
            });
            setBanner({ text: `Updated master SKU ${editingItem.SKU} successfully.`, type: 'success' });
          } else {
            await apiFetch('/api/inventory/items', {
              method: 'POST',
              body: JSON.stringify(itemForm)
            });
            setBanner({ text: `Created new master SKU ${itemForm.sku.toUpperCase()} successfully.`, type: 'success' });
          }
          setShowItemModal(false);
          loadAllErpData();
        } catch (err) {
          setBanner({ text: err.message, type: 'error' });
        }
      };

      const handleDeleteItem = async (item) => {
        if (!window.confirm(`Delete Master SKU ${item.SKU} (${item.ItemName}) across all warehouses?`)) return;
        try {
          await apiFetch(`/api/inventory/items/${item.ItemID}`, { method: 'DELETE' });
          setBanner({ text: `Deleted SKU ${item.SKU}.`, type: 'success' });
          loadAllErpData();
        } catch (err) {
          setBanner({ text: err.message, type: 'error' });
        }
      };

      const handleSaveMovement = async (e) => {
        e.preventDefault();
        try {
          const res = await apiFetch('/api/inventory/movements', {
            method: 'POST',
            body: JSON.stringify(moveForm)
          });
          setBanner({ text: `${res.message} (Auto-posted GL Journal Entry)`, type: 'success' });
          setShowMovementModal(false);
          loadAllErpData();
        } catch (err) {
          setBanner({ text: err.message, type: 'error' });
        }
      };

      const handleCreateSalesOrder = async (e) => {
        e.preventDefault();
        try {
          const res = await apiFetch('/api/erp/sales-orders', {
            method: 'POST',
            body: JSON.stringify(salesForm)
          });
          setBanner({ text: res.message, type: 'success' });
          setShowSalesModal(false);
          loadAllErpData();
        } catch (err) {
          setBanner({ text: err.message, type: 'error' });
        }
      };

      const handleCreateEmployee = async (e) => {
        e.preventDefault();
        try {
          const res = await apiFetch('/api/erp/employees', {
            method: 'POST',
            body: JSON.stringify(empForm)
          });
          setBanner({ text: res.message, type: 'success' });
          setShowEmployeeModal(false);
          loadAllErpData();
        } catch (err) {
          setBanner({ text: err.message, type: 'error' });
        }
      };

      if (!token || !user) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-950 via-slate-900 to-blue-950 p-6">
            <div className="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-2xl shadow-2xl p-8 backdrop-blur">
              <div className="flex items-center gap-3 mb-6">
                <div className="h-11 w-11 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-xl shadow-lg shadow-blue-600/30">
                  NX
                </div>
                <div>
                  <h1 className="text-xl font-bold text-white tracking-tight">NEXUS GLOBAL ERP v3.0</h1>
                  <p className="text-xs text-slate-400">Multi-Tenant Enterprise Resource Planning Suite</p>
                </div>
              </div>

              <div className="mb-6">
                <p className="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
                  1-Click Role Switcher (Test RBAC Permissions)
                </p>
                <div className="grid grid-cols-3 gap-2">
                  <button type="button" onClick={() => fillDemoRole('ADMIN')} className="px-3 py-2 rounded-lg text-xs font-medium bg-blue-600/20 border border-blue-500/40 text-blue-300 hover:bg-blue-600/30 transition">Global Admin</button>
                  <button type="button" onClick={() => fillDemoRole('OPERATOR')} className="px-3 py-2 rounded-lg text-xs font-medium bg-emerald-600/20 border border-emerald-500/40 text-emerald-300 hover:bg-emerald-600/30 transition">WMS Operator</button>
                  <button type="button" onClick={() => fillDemoRole('AUDITOR')} className="px-3 py-2 rounded-lg text-xs font-medium bg-amber-600/20 border border-amber-500/40 text-amber-300 hover:bg-amber-600/30 transition">SOX Auditor</button>
                </div>
              </div>

              {authError && (
                <div className="mb-4 p-3.5 rounded-lg bg-red-500/15 border border-red-500/40 text-red-200 text-xs leading-relaxed">
                  {authError}
                </div>
              )}

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-medium text-slate-300 mb-1">Corporate Email</label>
                  <input type="email" value={loginEmail} onChange={e => setLoginEmail(e.target.value)} className="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-700 text-sm text-white focus:outline-none focus:border-blue-500" required />
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-300 mb-1">Password</label>
                  <input type="password" value={loginPass} onChange={e => setLoginPass(e.target.value)} className="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-700 text-sm text-white focus:outline-none focus:border-blue-500" required />
                </div>
                <button type="submit" disabled={authLoading} className="w-full py-2.5 px-4 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm shadow-lg shadow-blue-600/30 transition">
                  {authLoading ? 'Authenticating with Multi-AZ RDS...' : 'Sign In to Enterprise Workspace'}
                </button>
              </form>
            </div>
          </div>
        );
      }

      const activeTenantObj = tenants.find(t => t.TenantID === activeTenantId);

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          <header className="bg-slate-900 border-b border-slate-800 px-6 py-3.5 flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center gap-4">
              <div className="flex items-center gap-2.5">
                <div className="h-9 w-9 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-base">NX</div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-bold text-white tracking-tight">NEXUS GLOBAL ERP v3.0</span>
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 font-semibold">MULTI-AZ RDS LIVE</span>
                  </div>
                  <p className="text-xs text-slate-400">{activeTenantObj?.CompanyName || user.companyName}</p>
                </div>
              </div>

              <div className="hidden md:flex items-center gap-2 pl-4 border-l border-slate-800">
                <span className="text-xs text-slate-400">Subsidiary:</span>
                <select
                  value={activeTenantId}
                  onChange={e => { setActiveTenantId(Number(e.target.value)); setSelectedWarehouseId('ALL'); setCurrentPage(1); }}
                  disabled={user.role !== 'ADMIN'}
                  className="bg-slate-950 border border-slate-700 text-xs text-slate-200 rounded-lg px-2.5 py-1.5"
                >
                  {tenants.map(t => <option key={t.TenantID} value={t.TenantID}>{t.TenantCode} — {t.Country} ({t.BaseCurrency})</option>)}
                </select>
              </div>
            </div>

            <div className="flex items-center gap-4">
              <div className="text-right">
                <div className="text-xs font-semibold text-white flex items-center justify-end gap-2">
                  {user.fullName}
                  <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
                    user.role === 'ADMIN' ? 'bg-blue-500/20 text-blue-300' :
                    user.role === 'OPERATOR' ? 'bg-emerald-500/20 text-emerald-300' :
                    'bg-amber-500/20 text-amber-300'
                  }`}>{user.role}</span>
                </div>
                <div className="text-[11px] text-slate-400">{user.department} • {user.email}</div>
              </div>
              <button onClick={handleLogout} className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 border border-slate-700 transition">Sign Out</button>
            </div>
          </header>

          <div className="bg-slate-900/60 border-b border-slate-800 px-6 flex items-center gap-2 overflow-x-auto">
            {[
              { id: 'WMS', label: '1. Inventory & Warehouse (WMS)' },
              { id: 'MOVEMENTS', label: `2. Stock Movement Ledger (${movements.length})` },
              { id: 'FINANCE', label: `3. Finance & General Ledger (${financeLedger.length})` },
              { id: 'SALES', label: `4. Sales & CRM Orders (${salesOrders.length})` },
              { id: 'HR', label: `5. HR & Global Workforce (${employees.length})` }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveModule(tab.id)}
                className={`py-3 px-4 text-xs font-semibold border-b-2 transition whitespace-nowrap ${
                  activeModule === tab.id ? 'border-blue-500 text-blue-400 bg-blue-500/5' : 'border-transparent text-slate-400 hover:text-slate-200'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </div>

          {banner && (
            <div className={`mx-6 mt-4 p-3 rounded-xl border flex items-center justify-between text-xs font-medium ${
              banner.type === 'success' ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' : 'bg-red-500/10 border-red-500/30 text-red-300'
            }`}>
              <span>{banner.text}</span>
              <button onClick={() => setBanner(null)} className="text-slate-400 hover:text-white ml-4">Dismiss</button>
            </div>
          )}

          <main className="flex-1 p-6 max-w-7xl w-full mx-auto space-y-6">
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
                <div className="text-xs text-slate-400">Active Catalog SKUs</div>
                <div className="text-2xl font-bold text-white mt-1">{items.length}</div>
                <div className="text-[11px] text-slate-400 mt-1">Across {warehouses.length} global warehouses</div>
              </div>
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
                <div className="text-xs text-slate-400">Total Units On Hand</div>
                <div className="text-2xl font-bold text-blue-400 mt-1">{kpis.totalUnits.toLocaleString()}</div>
                <div className="text-[11px] text-slate-400 mt-1">Real-time multi-bin tracking</div>
              </div>
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
                <div className="text-xs text-slate-400">Inventory Asset Valuation</div>
                <div className="text-2xl font-bold text-emerald-400 mt-1">${kpis.totalValuation.toLocaleString(undefined, { minimumFractionDigits: 2 })}</div>
                <div className="text-[11px] text-slate-400 mt-1">Synced with GL Account 1400-INV</div>
              </div>
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
                <div className="text-xs text-slate-400">Replenishment Alerts</div>
                <div className="flex items-baseline gap-3 mt-1">
                  <span className="text-2xl font-bold text-amber-400">{kpis.lowStockCount} Low</span>
                  <span className="text-lg font-bold text-red-400">{kpis.outOfStockCount} Out</span>
                </div>
                <div className="text-[11px] text-slate-400 mt-1">Monitored against SKU Reorder Points</div>
              </div>
            </div>

            {activeModule === 'WMS' && (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                <div className="p-5 border-b border-slate-800 flex flex-wrap items-center justify-between gap-4">
                  <div className="flex flex-wrap items-center gap-3 flex-1">
                    <input
                      type="text"
                      placeholder="Search SKU, Product Name, or Category..."
                      value={searchQuery}
                      onChange={e => { setSearchQuery(e.target.value); setCurrentPage(1); }}
                      className="w-full sm:w-72 px-3.5 py-2 rounded-lg bg-slate-950 border border-slate-700 text-xs text-white"
                    />
                    <select
                      value={selectedWarehouseId}
                      onChange={e => { setSelectedWarehouseId(e.target.value); setCurrentPage(1); }}
                      className="px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-xs text-slate-200"
                    >
                      <option value="ALL">All Warehouses ({warehouses.length})</option>
                      {warehouses.map(w => <option key={w.WarehouseID} value={String(w.WarehouseID)}>{w.WarehouseCode} — {w.City}</option>)}
                    </select>
                    <select
                      value={stockFilter}
                      onChange={e => { setStockFilter(e.target.value); setCurrentPage(1); }}
                      className="px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-xs text-slate-200"
                    >
                      <option value="ALL">All Stock Statuses</option>
                      <option value="LOW">Low Stock Warning Only</option>
                      <option value="OUT">Out of Stock (Critical)</option>
                      <option value="HEALTHY">Optimal Stock Only</option>
                    </select>
                  </div>
                  <div className="flex items-center gap-2.5">
                    {(user.role === 'ADMIN' || user.role === 'OPERATOR') && (
                      <button onClick={() => openMovementModal()} className="px-3.5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs">+ Log Stock Movement</button>
                    )}
                    {user.role === 'ADMIN' ? (
                      <button onClick={openCreateItemModal} className="px-3.5 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs">+ New Catalog SKU</button>
                    ) : (
                      <span className="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-400 text-[11px] border border-slate-700">Catalog Creation Locked ({user.role})</span>
                    )}
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="bg-slate-950/60 text-[11px] font-semibold uppercase tracking-wider text-slate-400 border-b border-slate-800">
                        <th className="py-3.5 px-4">SKU & Master Item</th>
                        <th className="py-3.5 px-4">Category</th>
                        <th className="py-3.5 px-4">Warehouse & Bin Locations</th>
                        <th className="py-3.5 px-4 text-right">Unit Cost / Price</th>
                        <th className="py-3.5 px-4 text-center">On-Hand vs Reorder</th>
                        <th className="py-3.5 px-4 text-center">Status</th>
                        <th className="py-3.5 px-4 text-right">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800 text-xs">
                      {paginatedItems.map(item => {
                        const qty = getEffectiveQty(item);
                        const isOut = qty === 0;
                        const isLow = qty > 0 && qty <= item.ReorderPoint;
                        return (
                          <tr key={item.ItemID} className={isOut ? 'bg-red-950/15' : isLow ? 'bg-amber-950/15' : 'hover:bg-slate-800/40'}>
                            <td className="py-3.5 px-4">
                              <div className="font-bold text-white font-mono">{item.SKU}</div>
                              <div className="text-slate-300 font-medium">{item.ItemName}</div>
                              {item.Description && <div className="text-[11px] text-slate-400">{item.Description}</div>}
                            </td>
                            <td className="py-3.5 px-4"><span className="px-2.5 py-1 rounded-md bg-slate-800 text-slate-300">{item.Category}</span></td>
                            <td className="py-3.5 px-4">
                              {(item.warehouseBalances || []).map(b => (
                                <span key={b.BalanceID} className="inline-flex gap-1 px-2 py-0.5 m-0.5 rounded bg-slate-950 border border-slate-700 text-[11px]">
                                  <strong className="text-blue-400">{b.WarehouseCode}</strong> ({b.BinLocation}): <strong className="text-white">{b.QuantityOnHand}</strong>
                                </span>
                              ))}
                            </td>
                            <td className="py-3.5 px-4 text-right font-mono">
                              <div>Cost: ${Number(item.UnitCost).toFixed(2)}</div>
                              <div className="text-emerald-400 font-semibold">Sell: ${Number(item.UnitPrice).toFixed(2)}</div>
                            </td>
                            <td className="py-3.5 px-4 text-center">
                              <div className="font-bold text-white text-sm">{qty} {item.UnitOfMeasure}</div>
                              <div className="text-[11px] text-slate-400">Min: {item.ReorderPoint} | Order: {item.ReorderQty}</div>
                            </td>
                            <td className="py-3.5 px-4 text-center">
                              {isOut ? <span className="px-2.5 py-1 rounded-full bg-red-500/20 text-red-300 font-bold text-[11px]">OUT OF STOCK</span> :
                               isLow ? <span className="px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 font-bold text-[11px]">LOW STOCK • REORDER {item.ReorderQty}</span> :
                               <span className="px-2.5 py-1 rounded-full bg-emerald-500/15 text-emerald-300 font-semibold text-[11px]">OPTIMAL</span>}
                            </td>
                            <td className="py-3.5 px-4 text-right space-x-1 whitespace-nowrap">
                              {(user.role === 'ADMIN' || user.role === 'OPERATOR') && (
                                <button onClick={() => openMovementModal(item)} className="px-2.5 py-1 rounded bg-emerald-600/20 text-emerald-300 border border-emerald-500/30">Move Stock</button>
                              )}
                              {user.role === 'ADMIN' && (
                                <>
                                  <button onClick={() => openEditItemModal(item)} className="px-2.5 py-1 rounded bg-slate-800 text-slate-200">Edit</button>
                                  <button onClick={() => handleDeleteItem(item)} className="px-2.5 py-1 rounded bg-red-600/20 text-red-300">Del</button>
                                </>
                              )}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>

                <div className="p-4 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
                  <div>Showing {paginatedItems.length} of {filteredItems.length} filtered SKUs</div>
                  <div className="flex items-center gap-2">
                    <button disabled={currentPage <= 1} onClick={() => setCurrentPage(p => Math.max(1, p - 1))} className="px-3 py-1.5 rounded bg-slate-800 disabled:opacity-40 text-white">Previous</button>
                    <span>Page {currentPage} of {totalPages}</span>
                    <button disabled={currentPage >= totalPages} onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))} className="px-3 py-1.5 rounded bg-slate-800 disabled:opacity-40 text-white">Next</button>
                  </div>
                </div>
              </div>
            )}

            {activeModule === 'MOVEMENTS' && (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl p-5">
                <div className="flex items-center justify-between mb-4">
                  <h2 className="text-sm font-bold text-white">Immutable Warehouse Stock Movement Ledger</h2>
                  {(user.role === 'ADMIN' || user.role === 'OPERATOR') && (
                    <button onClick={() => openMovementModal()} className="px-3.5 py-1.5 rounded-lg bg-emerald-600 text-white font-semibold text-xs">+ Log Movement</button>
                  )}
                </div>
                <table className="w-full text-left text-xs">
                  <thead>
                    <tr className="border-b border-slate-800 text-slate-400">
                      <th className="py-2.5">Timestamp</th>
                      <th className="py-2.5">Reference</th>
                      <th className="py-2.5">SKU & Item</th>
                      <th className="py-2.5">Warehouse / Bin</th>
                      <th className="py-2.5">Type</th>
                      <th className="py-2.5">Delta (Before → After)</th>
                      <th className="py-2.5">Executed By</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800">
                    {movements.map(m => (
                      <tr key={m.MovementID}>
                        <td className="py-2.5 font-mono text-slate-400">{new Date(m.CreatedAt).toLocaleString()}</td>
                        <td className="py-2.5 font-mono text-blue-400 font-semibold">{m.ReferenceDoc}</td>
                        <td className="py-2.5 font-bold text-white">{m.SKU} — <span className="font-normal text-slate-300">{m.ItemName}</span></td>
                        <td className="py-2.5 font-mono">{m.WarehouseCode} ({m.BinLocation})</td>
                        <td className="py-2.5">{m.MovementType}</td>
                        <td className="py-2.5 font-mono font-bold text-emerald-400">
                          {m.QuantityChange > 0 ? `+${m.QuantityChange}` : m.QuantityChange} ({m.QuantityBefore} → {m.QuantityAfter})
                        </td>
                        <td className="py-2.5 text-slate-300">{m.PerformedBy}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {activeModule === 'FINANCE' && (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl p-5">
                <h2 className="text-sm font-bold text-white mb-4">Real-Time Financial General Ledger (Auto-Posted from WMS)</h2>
                <table className="w-full text-left text-xs">
                  <thead>
                    <tr className="border-b border-slate-800 text-slate-400">
                      <th className="py-2.5">Journal #</th>
                      <th className="py-2.5">GL Account</th>
                      <th className="py-2.5">Entry Type</th>
                      <th className="py-2.5">Amount</th>
                      <th className="py-2.5">Reference Doc</th>
                      <th className="py-2.5">Memo & Posted By</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800">
                    {financeLedger.map(e => (
                      <tr key={e.EntryID}>
                        <td className="py-2.5 font-mono font-bold text-white">{e.JournalNumber}</td>
                        <td className="py-2.5"><span className="font-mono text-blue-400">{e.AccountCode}</span> — {e.AccountName}</td>
                        <td className="py-2.5 font-bold">{e.EntryType}</td>
                        <td className="py-2.5 font-mono font-bold text-emerald-400">${Number(e.Amount).toLocaleString(undefined, { minimumFractionDigits: 2 })}</td>
                        <td className="py-2.5 font-mono text-slate-400">{e.ReferenceDoc}</td>
                        <td className="py-2.5 text-slate-300">{e.Memo} ({e.PostedBy})</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {activeModule === 'SALES' && (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl p-5">
                <div className="flex items-center justify-between mb-4">
                  <h2 className="text-sm font-bold text-white">Enterprise Sales Orders & CRM Pipeline</h2>
                  {(user.role === 'ADMIN' || user.role === 'OPERATOR') && (
                    <button onClick={() => setShowSalesModal(true)} className="px-3.5 py-1.5 rounded-lg bg-blue-600 text-white font-semibold text-xs">+ New Sales Order</button>
                  )}
                </div>
                <table className="w-full text-left text-xs">
                  <thead><tr className="border-b border-slate-800 text-slate-400"><th className="py-2.5">Order #</th><th className="py-2.5">Customer</th><th className="py-2.5">Hub</th><th className="py-2.5">Status</th><th className="py-2.5">Total</th></tr></thead>
                  <tbody className="divide-y divide-slate-800">
                    {salesOrders.map(so => (
                      <tr key={so.OrderID}>
                        <td className="py-2.5 font-mono font-bold text-blue-400">{so.OrderNumber}</td>
                        <td className="py-2.5 font-semibold text-white">{so.CustomerName}</td>
                        <td className="py-2.5 font-mono">{so.WarehouseCode}</td>
                        <td className="py-2.5">{so.Status}</td>
                        <td className="py-2.5 font-mono font-bold">${Number(so.OrderTotal).toLocaleString(undefined, { minimumFractionDigits: 2 })}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {activeModule === 'HR' && (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl p-5">
                <div className="flex items-center justify-between mb-4">
                  <h2 className="text-sm font-bold text-white">Global Human Resources & Payroll Directory</h2>
                  {user.role === 'ADMIN' && (
                    <button onClick={() => setShowEmployeeModal(true)} className="px-3.5 py-1.5 rounded-lg bg-blue-600 text-white font-semibold text-xs">+ Onboard Employee</button>
                  )}
                </div>
                <table className="w-full text-left text-xs">
                  <thead><tr className="border-b border-slate-800 text-slate-400"><th className="py-2.5">ID</th><th className="py-2.5">Full Name</th><th className="py-2.5">Role & Dept</th><th className="py-2.5">Location</th><th className="py-2.5">Compensation</th></tr></thead>
                  <tbody className="divide-y divide-slate-800">
                    {employees.map(emp => (
                      <tr key={emp.EmployeeID}>
                        <td className="py-2.5 font-mono text-blue-400 font-bold">{emp.EmpCode}</td>
                        <td className="py-2.5 font-semibold text-white">{emp.FullName}</td>
                        <td className="py-2.5">{emp.JobTitle} • {emp.Department}</td>
                        <td className="py-2.5">{emp.Location}</td>
                        <td className="py-2.5 font-mono">{user.role === 'ADMIN' ? `$${Number(emp.AnnualSalary).toLocaleString()}` : 'REDACTED (ADMIN ONLY)'}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </main>

          {/* MODAL 1: CREATE / EDIT CATALOG SKU */}
          {showItemModal && (
            <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl">
                <h3 className="text-base font-bold text-white mb-4">{editingItem ? `Edit Master SKU: ${editingItem.SKU}` : 'Create Master Catalog SKU'}</h3>
                <form onSubmit={handleSaveCatalogItem} className="space-y-3 text-xs">
                  <div className="grid grid-cols-2 gap-3">
                    <input disabled={Boolean(editingItem)} value={itemForm.sku} onChange={e => setItemForm({ ...itemForm, sku: e.target.value })} placeholder="SKU (e.g. SRV-H100)" className="px-3 py-2 rounded bg-slate-950 border border-slate-700 text-white" required />
                    <input value={itemForm.category} onChange={e => setItemForm({ ...itemForm, category: e.target.value })} placeholder="Category" className="px-3 py-2 rounded bg-slate-950 border border-slate-700 text-white" required />
                  </div>
                  <input value={itemForm.itemName} onChange={e => setItemForm({ ...itemForm, itemName: e.target.value })} placeholder="Product Name" className="w-full px-3 py-2 rounded bg-slate-950 border border-slate-700 text-white" required />
                  <input value={itemForm.description} onChange={e => setItemForm({ ...itemForm, description: e.target.value })} placeholder="Technical Description" className="w-full px-3 py-2 rounded bg-slate-950 border border-slate-700 text-white" />
                  <div className="grid grid-cols-4 gap-2">
                    <input type="number" step="0.01" value={itemForm.unitCost} onChange={e => setItemForm({ ...itemForm, unitCost: e.target.value })} placeholder="Cost ($)" className="px-2.5 py-2 rounded bg-slate-950 border border-slate-700 text-white" required />
                    <input type="number" step="0.01" value={itemForm.unitPrice} onChange={e => setItemForm({ ...itemForm, unitPrice: e.target.value })} placeholder="Price ($)" className="px-2.5 py-2 rounded bg-slate-950 border border-slate-700 text-white" required />
                    <input type="number" value={itemForm.reorderPoint} onChange={e => setItemForm({ ...itemForm, reorderPoint: e.target.value })} placeholder="Reorder Pt" className="px-2.5 py-2 rounded bg-slate-950 border border-slate-700 text-white" required />
                    <input type="number" value={itemForm.reorderQty} onChange={e => setItemForm({ ...itemForm, reorderQty: e.target.value })} placeholder="Reorder Qty" className="px-2.5 py-2 rounded bg-slate-950 border border-slate-700 text-white" required />
                  </div>
                  {!editingItem && (
                    <div className="grid grid-cols-3 gap-2 pt-2 border-t border-slate-800">
                      <select value={itemForm.initialWarehouseId} onChange={e => setItemForm({ ...itemForm, initialWarehouseId: e.target.value })} className="px-2 py-2 rounded bg-slate-950 border border-slate-700 text-white">
                        {warehouses.map(w => <option key={w.WarehouseID} value={w.WarehouseID}>{w.WarehouseCode}</option>)}
                      </select>
                      <input value={itemForm.initialBin} onChange={e => setItemForm({ ...itemForm, initialBin: e.target.value })} placeholder="Bin" className="px-2.5 py-2 rounded bg-slate-950 border border-slate-700 text-white" />
                      <input type="number" value={itemForm.initialQty} onChange={e => setItemForm({ ...itemForm, initialQty: e.target.value })} placeholder="Initial Qty" className="px-2.5 py-2 rounded bg-slate-950 border border-slate-700 text-white" />
                    </div>
                  )}
                  <div className="flex justify-end gap-2 pt-4">
                    <button type="button" onClick={() => setShowItemModal(false)} className="px-4 py-2 rounded bg-slate-800 text-slate-300">Cancel</button>
                    <button type="submit" className="px-4 py-2 rounded bg-blue-600 text-white font-semibold">Save SKU</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 2: LOG STOCK MOVEMENT */}
          {showMovementModal && (
            <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl">
                <h3 className="text-base font-bold text-white mb-2">Log ACID Warehouse Stock Movement</h3>
                <form onSubmit={handleSaveMovement} className="space-y-3 text-xs">
                  <select value={moveForm.itemId} onChange={e => setMoveForm({ ...moveForm, itemId: e.target.value })} className="w-full px-3 py-2 rounded bg-slate-950 border border-slate-700 text-white">
                    {items.map(i => <option key={i.ItemID} value={i.ItemID}>{i.SKU} — {i.ItemName} (On Hand: {i.TotalQuantityOnHand})</option>)}
                  </select>
                  <div className="grid grid-cols-2 gap-3">
                    <select value={moveForm.warehouseId} onChange={e => setMoveForm({ ...moveForm, warehouseId: e.target.value })} className="px-3 py-2 rounded bg-slate-950 border border-slate-700 text-white">
                      {warehouses.map(w => <option key={w.WarehouseID} value={w.WarehouseID}>{w.WarehouseCode} — {w.City}</option>)}
                    </select>
                    <input value={moveForm.binLocation} onChange={e => setMoveForm({ ...moveForm, binLocation: e.target.value })} placeholder="Bin Location" className="px-3 py-2 rounded bg-slate-950 border border-slate-700 text-white" required />
                  </div>
                  <div className="grid grid-cols-3 gap-3">
                    <select value={moveForm.movementType} onChange={e => setMoveForm({ ...moveForm, movementType: e.target.value })} className="px-3 py-2 rounded bg-slate-950 border border-slate-700 text-white">
                      <option value="RECEIPT">RECEIPT (+)</option>
                      <option value="SHIPMENT">SHIPMENT (-)</option>
                      <option value="ADJUSTMENT">ADJUSTMENT (+/-)</option>
                    </select>
                    <input type="number" value={moveForm.quantity} onChange={e => setMoveForm({ ...moveForm, quantity: e.target.value })} placeholder="Qty" className="px-3 py-2 rounded bg-slate-950 border border-slate-700 text-white" required />
                    <input value={moveForm.referenceDoc} onChange={e => setMoveForm({ ...moveForm, referenceDoc: e.target.value })} placeholder="PO / SO Ref" className="px-3 py-2 rounded bg-slate-950 border border-slate-700 text-white" required />
                  </div>
                  <input value={moveForm.notes} onChange={e => setMoveForm({ ...moveForm, notes: e.target.value })} placeholder="Movement Notes / Reason" className="w-full px-3 py-2 rounded bg-slate-950 border border-slate-700 text-white" />
                  <div className="flex justify-end gap-2 pt-4">
                    <button type="button" onClick={() => setShowMovementModal(false)} className="px-4 py-2 rounded bg-slate-800 text-slate-300">Cancel</button>
                    <button type="submit" className="px-4 py-2 rounded bg-emerald-600 text-white font-semibold">Execute Movement</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 3: NEW SALES ORDER */}
          {showSalesModal && (
            <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
                <h3 className="text-base font-bold text-white mb-4">Create Enterprise Sales Order</h3>
                <form onSubmit={handleCreateSalesOrder} className="space-y-3 text-xs">
                  <input value={salesForm.customerName} onChange={e => setSalesForm({ ...salesForm, customerName: e.target.value })} placeholder="Customer Name (e.g. TD Bank Group)" className="w-full px-3 py-2 rounded bg-slate-950 border border-slate-700 text-white" required />
                  <input type="number" step="0.01" value={salesForm.orderTotal} onChange={e => setSalesForm({ ...salesForm, orderTotal: e.target.value })} placeholder="Order Total ($)" className="w-full px-3 py-2 rounded bg-slate-950 border border-slate-700 text-white" required />
                  <div className="flex justify-end gap-2 pt-4">
                    <button type="button" onClick={() => setShowSalesModal(false)} className="px-4 py-2 rounded bg-slate-800 text-slate-300">Cancel</button>
                    <button type="submit" className="px-4 py-2 rounded bg-blue-600 text-white font-semibold">Create Order</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 4: ONBOARD EMPLOYEE */}
          {showEmployeeModal && (
            <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
                <h3 className="text-base font-bold text-white mb-4">Onboard Global Employee</h3>
                <form onSubmit={handleCreateEmployee} className="space-y-3 text-xs">
                  <input value={empForm.fullName} onChange={e => setEmpForm({ ...empForm, fullName: e.target.value })} placeholder="Full Name" className="w-full px-3 py-2 rounded bg-slate-950 border border-slate-700 text-white" required />
                  <input value={empForm.jobTitle} onChange={e => setEmpForm({ ...empForm, jobTitle: e.target.value })} placeholder="Job Title" className="w-full px-3 py-2 rounded bg-slate-950 border border-slate-700 text-white" required />
                  <input type="number" value={empForm.annualSalary} onChange={e => setEmpForm({ ...empForm, annualSalary: e.target.value })} placeholder="Annual Salary ($)" className="w-full px-3 py-2 rounded bg-slate-950 border border-slate-700 text-white" required />
                  <div className="flex justify-end gap-2 pt-4">
                    <button type="button" onClick={() => setShowEmployeeModal(false)} className="px-4 py-2 rounded bg-slate-800 text-slate-300">Cancel</button>
                    <button type="submit" className="px-4 py-2 rounded bg-blue-600 text-white font-semibold">Save Employee</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<EnterpriseErpApp />);
  </script>
</body>
</html>
